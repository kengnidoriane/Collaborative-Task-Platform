spring:
  application:
    name: collaborative-task-platform-api-test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 2000ms

server:
  port: 0

logging:
  level:
    com.collaborative.task.platform: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: testSecretKeyForTestingPurposesOnly123456789
    access-token-expiration: 900000 # 15 minutes
    refresh-token-expiration: 604800000 # 7 days
    issuer: collaborative-task-platform-test
  
  webauthn:
    rp-id: localhost
    rp-name: Collaborative Task Platform Test
    origin: http://localhost:3000