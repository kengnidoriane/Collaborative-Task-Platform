version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: collaborative-tasks-postgres
    environment:
      POSTGRES_DB: collaborative_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Analytics
  mongodb:
    image: mongo:7.0
    container_name: collaborative-tasks-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: collaborative_tasks_analytics
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching and Sessions
  redis:
    image: redis:7.2-alpine
    container_name: collaborative-tasks-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot API (Development)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: collaborative-tasks-api
    environment:
      SPRING_PROFILES_ACTIVE: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: collaborative_tasks
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/collaborative_tasks_analytics?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: mySecretKey
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"
      - "8081:8081"  # WebSocket port
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/build
    profiles:
      - development

  # Next.js Frontend (Development)
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    container_name: collaborative-tasks-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    profiles:
      - development

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  default:
    name: collaborative-tasks-network